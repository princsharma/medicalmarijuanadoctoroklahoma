name: Fetch Google Reviews

on:
  schedule:
    - cron: "0 9 */3 * *" # Every 3 days at 9am UTC
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch reviews from SerpApi
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "Missing SERPAPI_KEY repository secret"
            exit 1
          fi

          curl -sS "https://serpapi.com/search.json?engine=google_maps_reviews&data_id=0x87b2130117034245:0x5b18753d5447eeac&api_key=${SERPAPI_KEY}&hl=en" \
          | node -e "
            const chunks = [];
            process.stdin.on('data', d => chunks.push(d));
            process.stdin.on('end', () => {
              const data = JSON.parse(Buffer.concat(chunks).toString('utf8'));
              if (data.error) {
                console.error(data.error);
                process.exit(1);
              }
              const out = {
                last_updated: new Date().toISOString(),
                reviews: (data.reviews || []).map(r => ({
                  author: r.user?.name ?? null,
                  rating: r.rating ?? null,
                  text: r.snippet ?? '',
                  date: r.date ?? null,
                  avatar: r.user?.thumbnail ?? null
                }))
              };
              process.stdout.write(JSON.stringify(out, null, 2));
            });
          " > public/reviews.json

      - name: Commit updated reviews
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/reviews.json
          git diff --cached --quiet || git commit -m "chore: update google reviews"
          git push
